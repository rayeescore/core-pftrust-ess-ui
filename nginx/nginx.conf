server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router uses history mode, so every path has to fall through to index.html or a refresh on
    # /loans/apply is a 404 from nginx rather than a route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # connect-src carries the API and Keycloak because the SPA talks to both; blob: is there because the
    # PDF preview reads generated statements through blob URLs, which is the part of a CSP that breaks
    # silently and only for the one feature.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://corepftessapi.mahindra.com https://coresso.mahindra.com blob:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location ~* \.(?:css|js|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
