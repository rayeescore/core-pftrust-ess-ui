server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router uses history mode, so every path has to fall through to index.html or a refresh on
    # /loans/apply is a 404 from nginx rather than a route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # connect-src carries the API and Keycloak because the SPA talks to both; blob: is there because
    # downloads hand generated statements to the browser through blob URLs, which is the part of a CSP
    # that breaks silently and only for the one feature.
    #
    # The API host is corepftapi.mahindra.com -- the admin API. There is no ESS backend (decided
    # 2026-09-16): the member surface lives in core-pftrust-service, which is deployed once. This named
    # corepftessapi.mahindra.com until then, which would have blocked every API call from this portal
    # with nothing in the UI to say why.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://qa-pft-api.coreintegra.com https://demo-sso.coreintegra.com https://corepftapi.mahindra.com https://coresso.mahindra.com blob:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location ~* \.(?:css|js|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
